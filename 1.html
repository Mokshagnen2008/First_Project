<!DOCTYPE html>
<html lang="en">
<head>

<body>

<center><p>Your INFORMATION</p></center>

<form>
           <label for="name"><i class="fa-solid fa-user"></i>First Name:</label>
            <input type="text" id="name" name="name"><br><br>
            <label for="lname">Last Name:</label>
            <input type="text" id="lname" name="lname"><br><br>
            <label for="age">Age:</label>
            <input type="number" id="age" name="age"><br><br>
            <label for="gender">Gender:</label>
            
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label><br><br>
         <label for="email"><i class="fa-solid fa-envelope"></i> Email<span class="required">*</span>:</label>
        <input type="email" id="email" name="email" required><br><br>
  
        <label for="phone"><i class="fa-solid fa-phone"></i> Phone:</label>
        <input type="tel" id="phone" name="phone"><br><br>
        <label for="address"><i class="fa-solid fa-home"></i> Address:</label>
        <input type="text" id="address" name="address"><br><br>
        <label for="contact"><i class="fa-solid fa-user"></i> Contact:</label>
        <input type="text" id="contact" name="contact"><br><br>
        <input type="submit" value="Submit" class="button">


    </form>
    
</body>

<style>
    body {
    min-height: 100vh;
    margin: 0;
    background-color: transparent;
    background-image: url(https://images.pexels.com/photos/34691131/pexels-photo-34691131.jpeg);
    background-size: cover;
    background-position: center;
   background-repeat: no-repeat;
   animation: moveBackground 20s ease-in-out infinite;
}

@keyframes moveBackground {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
   
  }
@keyframes formAppear {
    from {
        opacity: 0;
        transform: translateY(30px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}
form {
  
   background-color: #f2f2f200;
   padding: 20px;
   border-radius: 5px;
    width: 300px;
    margin: 30px auto;
    box-sizing: border-box;
    text-align: center;
    animation: formAppear 1s ease-out;

}

    label {
        display: block;
        margin-bottom: 5px;
        text-align: left;
    }

    input[type="text"],
    input[type="number"],
    input[type="email"],
    input[type="tel"] {
        width: 100%;
        padding: 8px;
        margin-bottom: 10px;
        border: none;
        border-bottom: 2px solid white;
        outline: none;
        background-color: transparent;
        color: white;
    }
    .required {
        color: red;
    }

.button {
    display: block;
    margin: 20px auto 10px;
    padding: 12px 28px;
    font-size: 16px;
    font-weight: bold;
    color: #fff;
    background: linear-gradient(to bottom right, #00c6ff, #0072ff);
    border: none;
    border-radius: 40px;
    box-shadow: 0 4px 0 #005fcc;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    cursor: pointer;
}

.button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 0 #005fcc;
}

.button:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #005fcc;
}

    input[type="radio"] {
        margin-right: 5px; color: #333;
    }
/* From Uiverse.io by Pankaj-Meharchandani */ 
.radio-inputs {
  display: flex;
  flex-direction: column; /* Stack elements vertically */
  justify-content: center;
  align-items: center;
  max-width: 100%; /* Ensure it doesn't overflow */
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
}

.radio-inputs > * {
  margin: 10px 0; /* Add vertical spacing between options */
}

.radio-input:checked + .radio-tile {
  border-color: #2260ff;
  box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
  color: #2260ff;
}

.radio-input:checked + .radio-tile:before {
  transform: scale(1);
  opacity: 1;
  background-color: #2260ff;
  border-color: #2260ff;
}

.radio-input:checked + .radio-tile .radio-icon svg {
  fill: #2260ff;
}

.radio-input:checked + .radio-tile .radio-label {
  color: #2260ff;
}

.radio-input:focus + .radio-tile {
  border-color: #2260ff;
  box-shadow:
    0 5px 10px rgba(0, 0, 0, 0.1),
    0 0 0 4px #b5c9fc;
}

.radio-input:focus + .radio-tile:before {
  transform: scale(1);
  opacity: 1;
}

.radio-tile {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: flex-start;
  width: 200px; /* Width of the pill */
  min-height: 50px; /* Height of the pill */
  border-radius: 25px; /* Full pill shape */
  border: 2px solid #b5bfd9;
  background-color: #fff;
  box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
  transition: 0.15s ease;
  cursor: pointer;
  position: relative;
  padding-left: 50px; /* Space for the indicator */
}

.radio-tile:before {
  content: "";
  position: absolute;
  display: block;
  width: 20px; /* Size of the indicator */
  height: 20px; /* Size of the indicator */
  border: 2px solid #b5bfd9;
  background-color: #fff;
  border-radius: 50%; /* Circle shape for the indicator */
  left: 15px; /* Position of the indicator */
  transition: 0.25s ease;
}

.radio-tile:hover {
  border-color: #2260ff;
}

.radio-tile:hover:before {
  transform: scale(1);
  opacity: 1;
}

.radio-icon {
  margin-left: 10px; /* Space between the indicator and icon */
}

.radio-icon svg {
  width: 1.5rem;
  height: 1.5rem;
  fill: #494949;
}

.radio-label {
  color: #707070;
  transition: 0.375s ease;
  text-align: left; /* Align text to the left */
  font-size: 13px;
  margin-left: 10px; /* Space between the icon and label */
}

.radio-input {
  clip: rect(0 0 0 0);
  -webkit-clip-path: inset(100%);
  clip-path: inset(100%);
  height: 1px;
  overflow: hidden;
  position: absolute;
  white-space: nowrap;
  width: 1px;
}

    input[type="radio"] + label {
        display: inline-block;
        margin-right: 10px;
    }

    input[type="radio"]:checked + label {
        font-weight: bold;
    }
    input[type="radio"] + label {
        display: inline-block;
        margin-right: 10px;
    }


</style>

    
</html>
